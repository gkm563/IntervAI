version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database with pgvector Extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intervai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: intervai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intervai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. IntervAI Core Backend Service (Node.js/TypeScript Express/Nest style)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: intervai-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/intervai_db
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: intervai_production_access_secret_sample_key_32_bytes
      JWT_REFRESH_SECRET: intervai_production_refresh_secret_sample_key_32_bytes
      EMAIL_PROVIDER: console
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. IntervAI AI Microservice (Python FastAPI)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: intervai-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      CORE_BACKEND_URL: http://backend:4000
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"

  # ---------------------------------------------------------------------------
  # 4. IntervAI Frontend Web Client (React 18 + Vite)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: intervai-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
